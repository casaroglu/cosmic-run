<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic frame renderer: drawFrame(t) paints the video at time t.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const MAIN = cv.getContext('2d');
let ctx = MAIN;
const OFF = Object.assign(document.createElement('canvas'), { width: 1080, height: 1920 });
const OFFC = OFF.getContext('2d');
const FONT = "'Inter', 'Helvetica Neue', Arial, sans-serif";
let TL = null, PHONE_SPANS = [], MSGS = [], CUR_T = 0, IMGS = {}, SPANS = [];

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const backOut = k => { k = clamp(k); const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(px, weight = 600) { ctx.font = `${weight} ${px}px ${FONT}`; }
function wrap(text, maxW) {
  const words = text.split(/\s+/); const lines = []; let cur = [];
  for (const w of words) {
    const test = [...cur, w].join(' ');
    if (ctx.measureText(test).width > maxW && cur.length) { lines.push(cur); cur = [w]; } else cur.push(w);
  }
  if (cur.length) lines.push(cur);
  return lines; // arrays of words
}

// ---------- scenes ----------
const SCENES = {};
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glow(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}
function stars(t, seed, n, maxY) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = r() * maxY, s = r() * 2.2 + .6, ph = r() * 6.28;
    ctx.globalAlpha = .35 + .45 * (0.5 + 0.5 * Math.sin(t * 1.5 + ph));
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
}
function skyline(t, seed, baseY, color, winColor, density = .35, layers = 1) {
  const r = rng(seed); let x = -20;
  while (x < W + 20) {
    const w = 70 + r() * 130, h = 200 + r() * 520 * layers;
    ctx.fillStyle = color; ctx.fillRect(x, baseY - h, w, h + 400);
    for (let wy = baseY - h + 24; wy < baseY - 10; wy += 34) for (let wx = x + 14; wx < x + w - 18; wx += 26) {
      const k = r();
      if (k < density) {
        const flick = Math.sin(t * .7 + k * 90) > -0.92 ? 1 : 0.2;
        ctx.globalAlpha = (.45 + r() * .5) * flick; ctx.fillStyle = winColor; ctx.fillRect(wx, wy, 11, 16);
      }
    }
    ctx.globalAlpha = 1; x += w + 4 + r() * 12;
  }
}
function rain(t, seed, n, alpha = .25, slant = .18) {
  const r = rng(seed); ctx.strokeStyle = `rgba(190,210,255,${alpha})`; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const sp = 1300 + r() * 900, x0 = r() * (W + 300), y0 = r() * H;
    const y = (y0 + t * sp) % (H + 100) - 50, x = (x0 - (t * sp * slant)) % (W + 300);
    const xx = x < 0 ? x + W + 300 : x;
    ctx.moveTo(xx, y); ctx.lineTo(xx - 40 * slant * 1.6, y + 40);
  }
  ctx.stroke();
}
function person(x, y, s, color, opts = {}) {
  if (opts.rim) { // light from behind: draw an enlarged, blurred copy in the rim colour first
    ctx.save(); ctx.shadowColor = opts.rim; ctx.shadowBlur = 40 * s;
    personShape(x, y, s, opts.rim, opts); ctx.restore();
  }
  personShape(x, y, s, color, opts);
}
function personShape(x, y, s, color, opts) {
  ctx.fillStyle = color;
  const hair = opts.hair || (opts.narrator !== false && TL && TL.hair);
  if (hair === 'long') {  // long hair falling past the shoulders
    ctx.beginPath(); ctx.moveTo(x - 66 * s, y - 10 * s);
    ctx.quadraticCurveTo(x - 92 * s, y + 150 * s, x - 70 * s, y + 230 * s); ctx.lineTo(x + 70 * s, y + 230 * s);
    ctx.quadraticCurveTo(x + 92 * s, y + 150 * s, x + 66 * s, y - 10 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - 4 * s, 66 * s, Math.PI, 0); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, 58 * s, 0, 6.283); ctx.fill();              // head
  ctx.beginPath(); ctx.ellipse(x, y + 70 * s, 28 * s, 30 * s, 0, 0, 6.283); ctx.fill(); // neck
  ctx.beginPath();                                                             // torso
  ctx.moveTo(x - 140 * s, y + 330 * s);
  ctx.quadraticCurveTo(x - 150 * s, y + 110 * s, x - 40 * s, y + 92 * s);
  ctx.lineTo(x + 40 * s, y + 92 * s);
  ctx.quadraticCurveTo(x + 150 * s, y + 110 * s, x + 140 * s, y + 330 * s);
  ctx.lineTo(x + 150 * s, y + (opts.legs ? 560 : 420) * s);
  ctx.lineTo(x - 150 * s, y + (opts.legs ? 560 : 420) * s); ctx.closePath(); ctx.fill();
  if (opts.legs) { ctx.fillRect(x - 110 * s, y + 540 * s, 80 * s, 420 * s); ctx.fillRect(x + 30 * s, y + 540 * s, 80 * s, 420 * s); }
  if (opts.phoneToEar) {
    ctx.beginPath(); ctx.moveTo(x + 110 * s, y + 160 * s); ctx.quadraticCurveTo(x + 150 * s, y + 40 * s, x + 60 * s, y + 10 * s);
    ctx.lineWidth = 46 * s; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.stroke();
  }
}

SCENES.black = (t) => {
  ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
  glow(W / 2, H * .45, 520, 'rgba(90,110,255,0.10)', .6 + .4 * Math.sin(t * 1.3));
};
SCENES.desk = (t) => {
  sky('#07091a', '#0d0f22');
  // wall shelves silhouettes
  ctx.fillStyle = '#0b0d1f'; ctx.fillRect(60, 260, 300, 18); ctx.fillRect(720, 380, 300, 18);
  const mx = W / 2, my = 900;
  glow(mx, my, 900, 'rgba(80,140,255,0.28)');
  // monitor
  ctx.fillStyle = '#0a0c18'; rr(mx - 400, my - 270, 800, 500, 22); ctx.fill();
  const g = ctx.createLinearGradient(0, my - 250, 0, my + 210); g.addColorStop(0, '#1d3a7a'); g.addColorStop(1, '#0e1d45');
  ctx.fillStyle = g; rr(mx - 380, my - 250, 760, 460, 12); ctx.fill();
  // scrolling code lines
  ctx.save(); rr(mx - 380, my - 250, 760, 460, 12); ctx.clip();
  const r = rng(7); const off = (t * 40) % 38;
  for (let i = -1; i < 14; i++) {
    const y = my - 230 + i * 38 - off; const ind = Math.floor(r() * 4) * 30, w = 120 + r() * 380;
    ctx.fillStyle = ['#7aa2ff', '#9ef0c8', '#ffd38a', '#c8a6ff'][Math.floor(r() * 4)]; ctx.globalAlpha = .55;
    rr(mx - 350 + ind, y, w, 14, 7); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#0a0c18'; ctx.fillRect(mx - 30, my + 230, 60, 90); ctx.fillRect(mx - 160, my + 310, 320, 20);
  // desk
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, my + 330, W, H);
  ctx.fillStyle = 'rgba(80,140,255,0.12)'; ctx.fillRect(0, my + 330, W, 6);
  // mug steam
  ctx.fillStyle = '#05060d'; rr(800, my + 250, 80, 90, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(200,220,255,0.18)'; ctx.lineWidth = 5;
  for (let k = 0; k < 2; k++) { ctx.beginPath(); for (let i = 0; i < 30; i++) { const yy = my + 240 - i * 6; const xx = 830 + k * 22 + Math.sin(i * .35 + t * 2 + k) * 10; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); }
  person(mx - 20, my + 170, 1.35, '#020308', { rim: 'rgba(110,160,255,0.55)' });
};
SCENES.room = (t) => {
  sky('#0a0b1c', '#120f24');
  // window
  const wx = 590, wy = 300, ww = 400, wh = 560;
  ctx.save(); rr(wx, wy, ww, wh, 8); ctx.clip();
  sky('#1a1840', '#2b1d4a');
  stars(t, 3, 40, wy + wh);
  ctx.fillStyle = '#f4f1e6'; ctx.beginPath(); ctx.arc(wx + 280, wy + 120, 46, 0, 6.283); ctx.fill();
  glow(wx + 280, wy + 120, 180, 'rgba(255,250,230,0.25)');
  ctx.translate(0, 120); skyline(t, 11, wy + wh, '#120f26', '#ffcc77', .3); ctx.translate(0, -120);
  rain(t, 4, 90, .28);
  ctx.restore();
  ctx.strokeStyle = '#05050c'; ctx.lineWidth = 18; ctx.strokeRect(wx, wy, ww, wh);
  ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  // moonlight patch
  ctx.fillStyle = 'rgba(160,150,255,0.05)'; ctx.beginPath(); ctx.moveTo(wx, wy + wh); ctx.lineTo(wx + ww, wy + wh); ctx.lineTo(wx + ww - 200, H); ctx.lineTo(wx - 400, H); ctx.fill();
  // bed
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 1300, W, H);
  ctx.fillStyle = '#0c0b18'; rr(-40, 1180, 760, 220, 40); ctx.fill();
  // person sitting with phone glow
  const px = 330, py = 900;
  glow(px + 60, py + 150, 340, 'rgba(120,170,255,0.45)', .85 + .15 * Math.sin(t * 3));
  person(px, py, 1.0, '#03030a', { rim: 'rgba(130,150,255,0.35)' });
  ctx.fillStyle = '#cfe0ff'; rr(px + 70, py + 150, 48, 80, 8); ctx.fill();
};
SCENES.city = (t) => {
  sky('#140a2e', '#3b1a4f');
  stars(t, 9, 120, 900);
  glow(W * .5, 1250, 900, 'rgba(255,110,170,0.22)');
  ctx.save(); ctx.translate(-((t * 6) % 40), 0);
  skyline(t, 21, 1350, '#1d1236', '#ff9ad5', .18, .7);
  ctx.restore();
  skyline(t, 5, 1650, '#0b0718', '#ffd27a', .35, 1.1);
  ctx.fillStyle = '#05030c'; ctx.fillRect(0, 1640, W, H);
  rain(t, 8, 160, .22);
};
SCENES.cafe = (t) => {
  sky('#1a0f0a', '#2a160e');
  // window with bokeh street lights
  ctx.save(); rr(80, 180, 920, 700, 20); ctx.clip();
  sky('#1b1030', '#3a1f2a');
  const r = rng(41);
  for (let i = 0; i < 26; i++) {
    const x = r() * 1000 + 40, y = 260 + r() * 560, rad = 30 + r() * 60, hue = ['255,190,120', '255,140,160', '160,190,255'][Math.floor(r() * 3)];
    glow(x + Math.sin(t * .4 + i) * 8, y, rad, `rgba(${hue},0.55)`);
  }
  rain(t, 12, 60, .18);
  ctx.restore();
  ctx.strokeStyle = '#120a06'; ctx.lineWidth = 22; ctx.strokeRect(80, 180, 920, 700);
  // pendant lamp
  ctx.strokeStyle = '#0d0705'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(540, 0); ctx.lineTo(540, 840); ctx.stroke();
  glow(540, 900, 700, 'rgba(255,170,90,0.35)');
  ctx.fillStyle = '#ffcf8a'; ctx.beginPath(); ctx.arc(540, 862, 26, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#120a06'; ctx.beginPath(); ctx.moveTo(470, 860); ctx.lineTo(610, 860); ctx.lineTo(570, 800); ctx.lineTo(510, 800); ctx.fill();
  // Sam, across the table, facing us
  const breathe = Math.sin(t * 1.6) * 4;
  person(560, 1000 + breathe, 0.85, '#160c08', { hair: 'short', rim: 'rgba(255,170,90,0.45)' });
  // table + candle
  ctx.fillStyle = '#0c0604'; ctx.fillRect(0, 1330, W, H);
  ctx.fillStyle = '#2a170d'; rr(-20, 1300, W + 40, 60, 10); ctx.fill();
  glow(380, 1250, 220, 'rgba(255,190,110,0.6)', .85 + .15 * Math.sin(t * 9));
  ctx.fillStyle = '#f3e6cf'; ctx.fillRect(366, 1230, 28, 70);
  ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.ellipse(380, 1216 + Math.sin(t * 11) * 2, 9, 18, 0, 0, 6.283); ctx.fill();
  // two glasses
  ctx.strokeStyle = 'rgba(255,220,180,0.5)'; ctx.lineWidth = 4;
  for (const gx of [660, 760]) { ctx.beginPath(); ctx.moveTo(gx - 26, 1180); ctx.lineTo(gx - 18, 1300); ctx.lineTo(gx + 18, 1300); ctx.lineTo(gx + 26, 1180); ctx.stroke(); }
  // phone face-down on the table, lights up during notifications
  const lit = NOTIFS.some(b => CUR_T >= b.appear && CUR_T < b.end + 0.4);
  ctx.fillStyle = lit ? '#cfe0ff' : '#1a1a22'; rr(820, 1310, 150, 34, 10); ctx.fill();
  if (lit) glow(895, 1320, 220, 'rgba(150,180,255,0.6)');
  // her, foreground from behind
  person(250, 1240, 1.45, '#050302', { rim: 'rgba(255,170,90,0.35)' });
};

SCENES.decree = (t) => {
  // an aged royal decree on a dark table, lit by a candle
  sky('#140c06', '#0a0603');
  glow(W * .5, H * .42, 900, 'rgba(255,170,90,0.25)', .9 + .1 * Math.sin(t * 7));
  const px = 150, py = 280, pw = 780, ph = 1080;
  ctx.save(); ctx.translate(W / 2, py + ph / 2); ctx.rotate(-0.025); ctx.translate(-W / 2, -(py + ph / 2));
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 60;
  const g = ctx.createRadialGradient(W / 2, py + ph * .45, 100, W / 2, py + ph / 2, 800);
  g.addColorStop(0, '#efdcb0'); g.addColorStop(1, '#b8945a');
  ctx.fillStyle = g; rr(px, py, pw, ph, 6); ctx.fill(); ctx.shadowBlur = 0;
  const r = rng(5);
  for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(110,70,30,${r() * .08})`; ctx.beginPath(); ctx.arc(px + r() * pw, py + r() * ph, r() * 40, 0, 6.283); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.fillStyle = '#3a2210';
  ctx.font = `700 54px 'DejaVu Serif', Georgia, serif`; ctx.fillText('EDICT OF EXPULSION', W / 2, py + 150);
  ctx.font = `italic 400 36px 'DejaVu Serif', Georgia, serif`; ctx.fillText('Granada, 31 March 1492', W / 2, py + 210);
  ctx.fillRect(W / 2 - 200, py + 245, 400, 3);
  // handwritten lines appear progressively
  ctx.strokeStyle = 'rgba(58,34,16,0.75)'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  const lines = 13, shown = clamp(t / 9) * lines;
  for (let l = 0; l < lines; l++) {
    const y = py + 320 + l * 46, len = l === lines - 1 ? 0.55 : 1, k = clamp(shown - l);
    if (k <= 0) break;
    ctx.beginPath();
    for (let x = 0; x < (pw - 160) * len * k; x += 6) {
      const xx = px + 80 + x, yy = y + Math.sin(x * .21 + l * 3) * 6 * (0.6 + 0.4 * Math.sin(x * .031 + l));
      x ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      if (r() < .05) { ctx.stroke(); ctx.beginPath(); x += 14; }
    }
    ctx.stroke();
  }
  // signatures + red wax seal
  ctx.font = `italic 400 40px 'DejaVu Serif', Georgia, serif`; ctx.fillStyle = '#3a2210';
  ctx.fillText('Yo el Rey', px + 220, py + ph - 150); ctx.fillText('Yo la Reina', px + pw - 230, py + ph - 150);
  const sk = easeOut((t - 4) / 0.5);
  if (sk > 0) {
    ctx.save(); ctx.translate(W / 2, py + ph - 110); ctx.scale(1.4 - .4 * sk, 1.4 - .4 * sk); ctx.globalAlpha = sk;
    ctx.fillStyle = '#8c1c13'; ctx.beginPath();
    for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283, rad = 70 + (i % 2 ? 6 : -4); ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    ctx.fill(); ctx.strokeStyle = '#5e100a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 46, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
};

const PHOTOS = {
  latte(x, y, w, h, t) {
    ctx.fillStyle = '#6b4a35'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#f2ece4'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w * .38, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#b07a52'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w * .32, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f6efe6'; const cx = x + w / 2, cy = y + h / 2 + 10, k = w * .12;
    ctx.beginPath(); ctx.moveTo(cx, cy + k); ctx.bezierCurveTo(cx - 2 * k, cy - .3 * k, cx - k, cy - 1.6 * k, cx, cy - .6 * k);
    ctx.bezierCurveTo(cx + k, cy - 1.6 * k, cx + 2 * k, cy - .3 * k, cx, cy + k); ctx.fill();
  },
  sunset(x, y, w, h, t) {
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#3b2a6b'); g.addColorStop(.55, '#ff7a59'); g.addColorStop(.56, '#2b3a6b'); g.addColorStop(1, '#162040');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ffd38a'; ctx.beginPath(); ctx.arc(x + w / 2, y + h * .55, w * .14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,211,138,0.6)';
    for (let i = 0; i < 6; i++) ctx.fillRect(x + w / 2 - (60 - i * 8), y + h * .6 + i * 18, (60 - i * 8) * 2, 5);
  },
  flower(x, y, w, h, t) {
    ctx.fillStyle = '#9fd3a8'; ctx.fillRect(x, y, w, h);
    const cx = x + w / 2, cy = y + h / 2;
    ctx.fillStyle = '#ff9fc2';
    for (let i = 0; i < 6; i++) { const a = i * 1.047; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * 62, cy + Math.sin(a) * 62, 56, 34, a, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = '#ffd35a'; ctx.beginPath(); ctx.arc(cx, cy, 40, 0, 6.283); ctx.fill();
  },
  cloud(x, y, w, h, t) {
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#4a90e2'); g.addColorStop(1, '#a8d4ff');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff'; const cx = x + w / 2, cy = y + h / 2;
    for (const [dx, dy, r] of [[-60, -20, 60], [40, -30, 70], [0, 20, 70], [-100, 30, 45], [100, 25, 50]]) { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, 6.283); ctx.fill(); }
  },
  street(x, y, w, h, t) {
    ctx.fillStyle = '#141a2e'; ctx.fillRect(x, y, w, h);
    const r = rng(77);
    for (let i = 0; i < 14; i++) glow(x + r() * w, y + r() * h * .7, 30 + r() * 40, ['rgba(255,200,120,.8)', 'rgba(255,120,150,.7)', 'rgba(120,180,255,.7)'][i % 3]);
    ctx.fillStyle = 'rgba(255,200,120,0.25)'; ctx.fillRect(x, y + h * .78, w, h * .22);
  },
};

SCENES.dawn = (t) => {
  sky('#2b2a5c', '#ff9e7a');
  const sunY = 1180 - easeOut(clamp(t / 12)) * 140;
  glow(W * .5, sunY, 700, 'rgba(255,210,150,0.55)');
  ctx.fillStyle = '#ffe3b0'; ctx.beginPath(); ctx.arc(W * .5, sunY, 110, 0, 6.283); ctx.fill();
  skyline(t, 31, 1500, '#5a3a5e', '#ffe0a0', .08, .8);
  ctx.fillStyle = '#2a1b30'; ctx.fillRect(0, 1480, W, H);
  // railing
  ctx.fillStyle = '#1a1020'; ctx.fillRect(0, 1460, W, 16);
  for (let x = 20; x < W; x += 70) ctx.fillRect(x, 1460, 10, 300);
  person(720, 900, 1.05, '#1a1020', { legs: true, phoneToEar: true, rim: 'rgba(255,200,150,0.5)' });
  // birds
  ctx.strokeStyle = 'rgba(40,20,40,.7)'; ctx.lineWidth = 4;
  for (let i = 0; i < 4; i++) {
    const bx = (200 + i * 90 + t * 40) % (W + 200) - 100, by = 500 + i * 35 + Math.sin(t * 2 + i) * 10, f = Math.sin(t * 8 + i) * 10;
    ctx.beginPath(); ctx.moveTo(bx - 22, by - f); ctx.quadraticCurveTo(bx - 8, by - 8, bx, by); ctx.quadraticCurveTo(bx + 8, by - 8, bx + 22, by - f); ctx.stroke();
  }
};

function drawImageScene(name, span, t) {
  const im = IMGS[name]; if (!im) return SCENES.black(t);
  const mv = (span && span.move) || {};
  const p = span ? ease(clamp((CUR_T - span.start) / Math.max(0.1, span.end - span.start))) : 0;
  const a = mv.from || [0.5, 0.5, 1.0], b = mv.to || [a[0], a[1], (a[2] || 1) * 1.12];
  const cx = lerp(a[0], b[0], p), cy = lerp(a[1], b[1], p), z = lerp(a[2] || 1, b[2] || 1, p);
  const s = Math.max(W / im.width, H / im.height) * z, dw = im.width * s, dh = im.height * s;
  let x = W / 2 - cx * dw, y = H / 2 - cy * dh;
  if (dw < W || dh < H) {

    ctx.save(); ctx.translate(px, py); ctx.scale(kk, kk);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(-w / 2 + 4, -h - 22 + 6, w, h, 18); ctx.fill();
    ctx.fillStyle = TL.accent; rr(-w / 2, -h - 22, w, h, 18); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-16, -23); ctx.lineTo(16, -23); ctx.lineTo(0, 0); ctx.fill();
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l.text, 0, -h / 2 - 20);
    ctx.restore();
  });
  if (b.ring) {
    const p = anchorAt(b.ring, t); const kk = Math.min(k, out);
    if (p && kk > 0) {
      const r = 150 * (1 + 0.04 * Math.sin(t * 6));
      ctx.save(); ctx.globalAlpha = kk; ctx.lineWidth = 14; ctx.strokeStyle = '#FF7A1A';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p[0], p[1], r * kk, 0, Math.PI * 2); ctx.stroke();
      ctx.lineCap = 'round'; ctx.lineWidth = 26; const a = Math.PI / 4;
      ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r);
      ctx.lineTo(p[0] + Math.cos(a) * (r + 120), p[1] + Math.sin(a) * (r + 120)); ctx.stroke();

    const kk = Math.min(backOut((t - b.start - 0.6) / 0.4), out); if (kk <= 0) return;
    ctx.save(); ctx.translate(W / 2, 420); ctx.rotate(-0.03); ctx.scale(kk, kk);
    font(96, 900); const w = ctx.measureText(b.banner).width + 100;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(-w / 2 + 8, -70 + 10, w, 140, 24); ctx.fill();
    ctx.fillStyle = TL.accent; rr(-w / 2, -70, w, 140, 24); ctx.fill();
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.banner, 0, 6);
    ctx.restore();
  }
}

// ---------- frame ----------
function drawFrame(t) {
  CUR_T = t;
  ctx = MAIN;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const b = beatAt(t);
  if (TL.overlay) {  // transparent captions/callouts over a pre-rendered 3D video
    ctx.clearRect(0, 0, W, H);
    drawCallouts(b, t);
    if (b.type === 'title') drawTitle(b, t);
    else if (b.type === 'narration') drawCaptions(b, t);
    else if (b.type === 'end') drawEnd(b, t);
    const fo = Math.min(clamp(t / 0.35), clamp((TL.duration - t) / 0.5));
    if (fo < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fo})`; ctx.fillRect(0, 0, W, H); }
    return;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // scene with crossfade on change
  const idx = TL.beats.indexOf(b);
  let sceneStart = b.start, prevScene = null;
  for (let i = idx; i > 0; i--) {
    if (TL.beats[i - 1].scene !== b.scene) { sceneStart = TL.beats[i].start; prevScene = TL.beats[i - 1].scene; break; }
    sceneStart = TL.beats[i - 1].start;
  }
  const fadeK = clamp((t - sceneStart) / 0.7);
  if (prevScene && fadeK < 1) drawScene(prevScene, t, 1);
  drawScene(b.scene, t - sceneStart, prevScene ? ease(fadeK) : 1);

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  const pv = phoneVis(t);
  drawPhone(t, pv);

  for (const nb of NOTIFS) drawNotify(nb, t);
  drawDate(t); drawCredit(t, b);
  if (b.type === 'title') { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H); drawTitle(b, t); }
  else if (b.type === 'narration') { ctx.save(); ctx.globalAlpha = 1 - pv; drawCaptions(b, t); ctx.restore(); }
  else if (b.type === 'end') drawEnd(b, t);

  // film grain
  const r = rng(Math.floor(t * 30) + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let i = 0; i < 900; i++) ctx.fillRect(r() * W, r() * H, 2, 2);
  // fade in/out of whole video
  const fo = Math.min(clamp(t / 0.35), clamp((TL.duration - t) / 0.5));
  if (fo < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fo})`; ctx.fillRect(0, 0, W, H); }
}

async function setup(tl) {
  TL = tl;
  await Promise.all(['900 80px Inter', '700 40px Inter', '500 40px Inter', '600 30px Inter', '400 36px "JetBrains Mono"'].map(f => document.fonts.load(f).catch(() => 0)));
  // phone spans
  PHONE_SPANS = []; let cur = null;
  for (const b of TL.beats) {
    if (isPhone(b)) { if (cur && Math.abs(cur[1] - b.start) < 0.01) cur[1] = b.end; else { cur = [b.start, b.end]; PHONE_SPANS.push(cur); } }
    else cur = null;
  }
  MSGS = TL.beats.filter(isPhone).map(b => ({ ...b }));
  NOTIFS = TL.beats.filter(b => b.type === 'notify');
  IMGS = {};
  await Promise.all(Object.entries(TL.images || {}).map(([k, v]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IMGS[k] = im; res(); }; im.onerror = () => res(); im.src = v.src;
  })));
  SPANS = [];
  for (const b of TL.beats) {
    const last = SPANS[SPANS.length - 1];
    if (last && last.scene === b.scene) { last.end = b.end; if (!last.move && b.move) last.move = b.move; }
    else SPANS.push({ scene: b.scene, start: b.start, end: b.end, move: b.move });
  }
  MSGS.forEach(layoutMsg);
  return true;
}
function frames(t0, n, fps, q = 0.9) {
  const out = [];
  for (let i = 0; i < n; i++) { drawFrame(t0 + i / fps); out.push(TL.overlay ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', q)); }
  return out;
}
window.setup = setup; window.drawFrame = drawFrame; window.frames = frames;
