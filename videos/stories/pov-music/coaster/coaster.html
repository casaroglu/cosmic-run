let SNOW;

  const gr = dx.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); dx.fillStyle = gr; dx.fillRect(0, 0, 32, 32);

function updateSnow(t) {

  const b = SNOW.userData.base, p = SNOW.geometry.attributes.position, c = camera.position;

function sledTrail(pal) { // packed-snow ribbon under the sled

function railLights(pal, sideOff = 0.85, upOff = -0.05, every = 4, poles = false) { // these (not the camera) pulse with the kick drum

function buildCart(pal) { // front of the car, attached to the camera
  const g = new THREE.Group();
  if (MODE === 'sled') {
    const wood = new THREE.MeshStandardMaterial({ color: pal.cart, roughness: 0.6 });
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.7), wood); board.position.set(0, -1.05, -1.9); g.add(board);
    for (const z of [-1.7, -2.05]) { const sl = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.065, 0.05), new THREE.MeshStandardMaterial({ color: 0x4a2c16 })); sl.position.set(0, -1.02, z); g.add(sl); }
    for (const x of [-0.55, 0.55]) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.04, 6, 16, Math.PI), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.3 })); r.rotation.y = Math.PI / 2; r.scale.setScalar(0.8); r.position.set(x * 0.75, -1.1, -2.35); g.add(r); }

  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.35, 1.0), body); nose.position.set(0, -1.32, -1.35); nose.rotation.x = 0.12; g.add(nose);

// ---------- captions (style from story-video renderer) ----------
const FONT = "'Inter','Helvetica Neue',Arial,sans-serif";
function backOut(x) { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lyricLines() { // group words into caption chunks by line break (max 4 words)
  const out = []; let cur = [];
  for (const w of TL.words) {
    cur.push(w);
    if (cur.length >= 6 || w.eol) { out.push(cur); cur = []; }
  }
  if (cur.length) out.push(cur);
  return out;
}
function drawCaptions(t) {
  const cs = TL._chunks; let c = null;
  for (let i = 0; i < cs.length; i++) {
    const s = cs[i][0].t0, last = cs[i][cs[i].length - 1], e = Math.min(i + 1 < cs.length ? cs[i + 1][0].t0 : 1e9, last.t1 + 0.9);
    if (t >= s - 0.05 && t < e) { c = cs[i]; c.s = s; break; }
  }
  if (!c) return;
  octx.font = `900 92px ${FONT}`;
  const sp = 24, words = c.map(w => w.w.toUpperCase()), widths = words.map(w => octx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (c.length - 1), scale = Math.min(1, 980 / total);
  const pop = backOut((t - c.s) / 0.18);
  octx.save(); octx.translate(W / 2, TL.captionY || (MODE === 'sled' ? 1200 : 1380)); octx.scale(scale * (0.85 + 0.15 * pop), scale * (0.85 + 0.15 * pop));

  c.forEach((w, i) => {
    const active = t >= w.t0 - 0.03, now = active && t < (c[i + 1] ? c[i + 1].t0 : w.t1 + 0.3);
    const hop = now ? -10 * Math.max(0, 1 - (t - w.t0) / 0.15) : 0;
    octx.lineWidth = 18; octx.strokeStyle = 'rgba(0,0,0,0.92)'; octx.strokeText(words[i], x, hop);
    octx.fillStyle = now ? TL.accent : active ? '#ffffff' : 'rgba(255,255,255,0.55)';
    octx.fillText(words[i], x, hop); x += widths[i] + sp;

}
function drawTitle(t) {

  octx.save(); octx.globalAlpha = a; octx.font = `900 64px ${FONT}`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.lineJoin = 'round'; octx.lineWidth = 16; octx.strokeStyle = 'rgba(0,0,0,0.9)';
  TL.title.forEach((ln, i) => { octx.strokeText(ln, W / 2, 330 + i * 84); octx.fillStyle = i ? TL.accent : '#fff'; octx.fillText(ln, W / 2, 330 + i * 84); });

// ---------- frame ----------
function beatPulse(t, arr, k) { // decaying pulse after the most recent beat

// ---------- lyric props ----------
function frameAt(si) { const N = track.N, i = ((Math.round(si) % N) + N) % N; return { p: track.pos[i], tan: track.tan[i], up: track.up[i], side: track.side[i] }; }
const headingOf = v => Math.atan2(v.x, v.z);
function placeProps() {
  const Y = new THREE.Vector3(0, 1, 0);

    const t0 = P.t, sideSign = P.side === 'left' ? -1 : P.side === 'right' ? 1 : (n % 2 ? 1 : -1);

      const F = frameAt(sAt(t0) + (P.ahead ?? 16) / track.ds), m = new THREE.Matrix4();
      m.makeBasis(F.side, F.up, F.tan).setPosition(F.p); b.obj.applyMatrix4(m); rec.scale = 1; scene.add(b.obj); rec.kind = 'arch';
    } else if (b.ground) {

      else b.obj.position.set(F.p.x, 0.05, F.p.z); b.obj.rotation.y = headingOf(F.tan.clone().negate()); rec.scale = 1; scene.add(b.obj);

      b.obj.position.copy(pos);

}
function bigTree() {
  const g = new THREE.Group();

  [[2.5, 6, 4.5], [2.0, 5, 7.5], [1.4, 4, 10]].forEach(([r, h, y]) => { const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 9), new THREE.MeshLambertMaterial({ color: 0x23563a })); c.position.y = y; g.add(c);
    const sn = new THREE.Mesh(new THREE.ConeGeometry(r * 0.55, h * 0.45, 9), new THREE.MeshLambertMaterial({ color: 0xffffff })); sn.position.y = y + h * 0.3; g.add(sn); });
  return g;
}
function avalanche(t0) {

    const m = new THREE.Mesh(g, mat), a = (rng() - 0.5) * 26, l = (rng() - 0.5) * 30;
    const p = F.p.clone().addScaledVector(F.side, a).addScaledVector(F.tan, l);
    m.userData = { x: p.x, z: p.z, top: p.y + 14 + rng() * 20, floor: MODE === 'sled' ? groundH(p.x, p.z) + 0.45 : Math.max(0.4, F.p.y < 10 ? 0.4 : -1e9), delay: rng() * 1.2, spin: rng() * 6 };

function updateProps(t) {
  NEON = 0;
  for (const r of PROPS) {
    const dt = t - r.t0;
    if (r.kind === 'neon') { if (dt > 0 && dt < 4) NEON = Math.max(NEON, 1 - dt / 4); continue; }
    if (r.kind === 'avalanche') {
      for (const m of r.init) {

        m.visible = tt > 0 && dt < 12;

        m.position.set(u.x, Math.max(u.floor, u.top - 4.9 * tt * tt), u.z); m.rotation.set(tt * u.spin, tt * 2, 0);

    if (r.emerge) { const k = backOut((dt + 1.1) / 0.55); r.b.obj.position.lerpVectors(r.emerge.from, r.emerge.to, Math.max(0, k)); r.b.obj.position.y = groundH(r.b.obj.position.x, r.b.obj.position.z); }

    else { r.b.obj.visible = vis; if (r.kind !== 'arch') r.b.obj.scale.setScalar(Math.max(0.01, r.scale * pop)); }

      r.b.obj.position.y = MODE === 'sled' ? groundH(r.b.obj.position.x, r.b.obj.position.z) : Math.max(0, F.p.y - 0.9);

function drawFrame(t) {
  const s = sAt(t), p = sample(track.pos, s), up = sample(track.up, s).normalize();
  const look = sample(track.pos, s + 7 / track.ds), lup = sample(track.up, s + 7 / track.ds).normalize();

  out = document.createElement('canvas'); out.width = W; out.height = H; octx = out.getContext('2d');
  document.body.appendChild(out);

  const pal0 = tl.palette; Object.assign(GROUND, { hills: pal0.hills ?? 2.4, mount: pal0.mount ?? 1, roll: pal0.roll ?? 0 });

function nearestIdx(v) { let b = 0, d = 1e9; track.pos.forEach((p, i) => { const e = p.distanceTo(v); if (e < d) { d = e; b = i; } }); return b; }
function frames(t0, n, fps, q = 0.9) { const o = []; for (let i = 0; i < n; i++) { drawFrame(t0 + i / fps); o.push(out.toDataURL('image/jpeg', q)); } return o; }
window.setup = setup; window.frames = frames; window.ready = true;
</script>
