<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/.claude/skills/story-video/scripts/node_modules/three/build/three.module.js"}}</script>

<script type="module">
// Procedural roller-coaster POV + karaoke captions. Every pixel is generated here (three.js, MIT).
// window.setup(tl) then window.frames(t0, n, fps) -> JPEG data URLs (1080x1920).
import * as THREE from 'three';

const W = 1080, H = 1920;
let TL, renderer, scene, camera, out, octx, track, timeMap, rng;

// ---------- small helpers ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function vnoise(x, z) { // cheap smooth value noise
  const s = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return (s(xi, zi) * (1 - u) + s(xi + 1, zi) * u) * (1 - v) + (s(xi, zi + 1) * (1 - u) + s(xi + 1, zi + 1) * u) * v;
}

// ---------- track ----------
// [x, y, z, hint] ; hint = up-vector hint (default world up). Loop points get "towards centre".
function trackPoints(P) {
  const pts = [];
  const add = (x, y, z, h) => pts.push({ p: new THREE.Vector3(x, y, z), h: h || new THREE.Vector3(0, 1, 0) });
  add(0, 4, -40); add(0, 4, -22);                       // station
  add(0, 7, -2); add(0, 27, 38); add(0, 47, 76);        // lift hill
  add(0, 51, 88); add(0, 49.5, 97);                     // crest
  add(0, 28, 113); add(0, 6, 134); add(0, 3.2, 152);    // first drop
  const R = 16, cz = 172, cy = 3.2 + R, dx = 9;         // vertical loop (slightly offset sideways)
  for (let k = 0; k <= 8; k++) {
    const f = k / 8 * Math.PI * 2;
    add(dx * k / 8, cy - R * Math.cos(f), cz + R * Math.sin(f), new THREE.Vector3(0, Math.cos(f), -Math.sin(f)));
  }
  add(dx, 3.5, 192); add(10, 24, 222); add(12, 5, 250);  // camelback
  add(24, 6, 280); add(48, 9, 296); add(74, 8, 284); add(86, 6, 258);   // banked 180
  add(87, 19, 228); add(87, 5, 204); add(86, 15, 180); add(84, 4.5, 156);   // airtime hills
  add(70, 6, 128); add(92, 8, 96); add(78, 6, 64);        // S-bends
  add(86, 6, 30); add(80, 5, -8); add(60, 4.5, -44);      // run home
  add(34, 4, -64); add(10, 4, -62);
  return pts;
}

function buildTrack() {
  const cps = trackPoints();
  const curve = new THREE.CatmullRomCurve3(cps.map(c => c.p), true, 'centripetal');
  const hcurve = new THREE.CatmullRomCurve3(cps.map(c => c.h), true, 'catmullrom', 0.5);
  curve.arcLengthDivisions = 20000;
  const L = curve.getLength(), N = Math.round(L / 0.25);
  const pos = [], tan = [], hint = [];
  for (let i = 0; i < N; i++) {
    const u = i / N, t = curve.getUtoTmapping(u);
    pos.push(curve.getPoint(t)); tan.push(curve.getTangent(t).normalize()); hint.push(hcurve.getPoint(t).normalize());
  }
  const ds = L / N;
  let hmax = -1e9, crest = 0;
  for (let i = 0; i < N * 0.3; i++) if (pos[i].y > hmax) { hmax = pos[i].y; crest = i; }
  // physics speed (lift = constant), then auto-banking from horizontal curvature
  const v = pos.map((p, i) => i <= crest ? 4 : Math.sqrt(2 * 9.81 * Math.max(0.6, hmax + 1.2 - p.y)));
  const bankRaw = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const a = tan[(i - 8 + N) % N], b = tan[(i + 8) % N];
    const ha = Math.atan2(a.x, a.z), hb = Math.atan2(b.x, b.z);
    let d = hb - ha; d = Math.atan2(Math.sin(d), Math.cos(d));
    const kappa = d / (16 * ds), flat = Math.pow(clamp(hint[i].y), 6);
    bankRaw[i] = clamp(Math.atan(v[i] * v[i] * kappa / 9.81) * 0.6, -0.9, 0.9) * flat;
  }
  const bank = new Float32Array(N), K = 40;
  for (let i = 0; i < N; i++) { let s = 0; for (let j = -K; j <= K; j++) s += bankRaw[(i + j + N) % N]; bank[i] = s / (2 * K + 1); }
  const up = [], side = [];
  for (let i = 0; i < N; i++) {
    const t = tan[i], h = hint[i].clone();
    h.addScaledVector(t, -h.dot(t)).normalize();
    h.applyAxisAngle(t, -bank[i]);
    up.push(h); side.push(new THREE.Vector3().crossVectors(t, h).normalize());
  }
  // smooth up vectors a little
  return { curve, L, N, ds, pos, tan, up, side, v, crest, hmax };
}

// time warp: frame time -> arc index. Video starts at track index START (partway up the lift) and the
// circuit closes on the same spot at t = duration, so the clip loops seamlessly.
// keys pin track indices to music times (lift crest, loop top).
let START = 0;
function buildTimeMap(tr, keys, dur, liftSpeed) {
  const N = tr.N, crestT = keys.find(k => k.at === 'crest');
  START = crestT ? Math.max(0, tr.crest - Math.round(liftSpeed * crestT.t / tr.ds)) : 0;
  const v = i => (i >= START && i <= tr.crest) ? liftSpeed : (i < START ? 14 : tr.v[i]);
  const T = new Float64Array(N + 1);
  for (let r = 0; r < N; r++) T[r + 1] = T[r] + tr.ds / v((START + r) % N);
  const ks = [{ i: 0, t: 0 }, ...keys.map(k => ({ i: (k.i - START + N) % N, t: k.t })), { i: N, t: dur }].sort((a, b) => a.i - b.i);
  const M = new Float64Array(N + 1);
  for (let k = 0; k < ks.length - 1; k++) {
    const a = ks[k], b = ks[k + 1], sc = (b.t - a.t) / (T[b.i] - T[a.i]);
    for (let i = a.i; i <= b.i; i++) M[i] = a.t + (T[i] - T[a.i]) * sc;
  }
  return M;
}
function sAt(t) { // fractional sample index for time t
  const M = timeMap; let lo = 0, hi = M.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (M[m] <= t) lo = m; else hi = m; }
  return START + lo + clamp((t - M[lo]) / Math.max(1e-6, M[hi] - M[lo]));
}
function sample(arr, s) {
  const N = track.N, i = Math.floor(s), f = s - i;
  return arr[((i % N) + N) % N].clone().lerp(arr[(((i + 1) % N) + N) % N], f);
}

// ---------- world ----------
function trackMesh(tr, pal) {
  const g = new THREE.Group();
  const railMat = new THREE.MeshStandardMaterial({ color: pal.rail, metalness: 0.6, roughness: 0.35 });
  const spineMat = new THREE.MeshStandardMaterial({ color: pal.spine, metalness: 0.3, roughness: 0.5 });
  const mk = (off, offUp, r, mat) => {
    const pts = tr.pos.map((p, i) => p.clone().addScaledVector(tr.side[i], off).addScaledVector(tr.up[i], offUp));
    const c = new THREE.CatmullRomCurve3(pts.filter((_, i) => i % 4 === 0), true);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(c, Math.round(tr.N / 2), r, 8, true), mat));
  };
  mk(-0.62, 0, 0.09, railMat); mk(0.62, 0, 0.09, railMat); mk(0, -0.55, 0.22, spineMat);
  // ties
  const tieGeo = new THREE.BoxGeometry(1.5, 0.12, 0.22), n = Math.floor(tr.L / 1.2);
  const ties = new THREE.InstancedMesh(tieGeo, spineMat, n), m = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let k = 0; k < n; k++) {
    const i = Math.floor(k * tr.N / n), p = tr.pos[i].clone().addScaledVector(tr.up[i], -0.25);
    m.makeBasis(tr.side[i], tr.up[i], tr.tan[i]).setPosition(p); ties.setMatrixAt(k, m);
  }
  g.add(ties);
  // supports
  const supGeo = new THREE.CylinderGeometry(0.22, 0.3, 1, 8); supGeo.translate(0, 0.5, 0);
  const sups = []; const step = Math.round(7 / tr.ds);
  for (let i = 0; i < tr.N; i += step) if (tr.up[i].y > 0.75 && tr.pos[i].y > 2.5) sups.push(i);
  const S = new THREE.InstancedMesh(supGeo, new THREE.MeshStandardMaterial({ color: pal.support, roughness: 0.6 }), sups.length * 2);
  sups.forEach((i, k) => {
    for (const sgn of [-1, 1]) {
      const p = tr.pos[i].clone().addScaledVector(tr.side[i], 0.62 * sgn).addScaledVector(tr.up[i], -0.3);
      m.compose(new THREE.Vector3(p.x, 0, p.z), q.identity(), new THREE.Vector3(1, p.y, 1)); S.setMatrixAt(k * 2 + (sgn > 0), m);
    }
  });
  g.add(S);
  return g;
}

function nearTrack(x, z, r) {
  for (let i = 0; i < track.N; i += 12) { const p = track.pos[i]; if ((p.x - x) ** 2 + (p.z - z) ** 2 < r * r) return true; }
  return false;
}

function buildWorld(pal) {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(pal.fog, 120, 900);
  // sky dome
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(pal.skyTop) }, hor: { value: new THREE.Color(pal.skyHor) }, sun: { value: new THREE.Vector3(...pal.sunDir).normalize() }, sunC: { value: new THREE.Color(pal.sun) } },
    vertexShader: 'varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `uniform vec3 top,hor,sun,sunC; varying vec3 vp;
      void main(){ float h = clamp(vp.y,0.,1.); vec3 c = mix(hor, top, pow(h,0.55));
        float d = max(dot(vp, sun),0.); c += sunC*(pow(d,900.)*2.5 + pow(d,12.)*0.35);
        gl_FragColor = vec4(c,1.); }`,
  }));
  scene.add(sky);
  scene.add(new THREE.HemisphereLight(pal.skyTop, pal.ground, 1.4));
  const sunL = new THREE.DirectionalLight(0xffffff, 2.2); sunL.position.set(...pal.sunDir); scene.add(sunL);

  // terrain
  const tg = new THREE.PlaneGeometry(2400, 2400, 240, 240); tg.rotateX(-Math.PI / 2);
  const pa = tg.attributes.position, col = [];
  const g1 = new THREE.Color(pal.ground), g2 = new THREE.Color(pal.ground2), tmp = new THREE.Color();
  for (let i = 0; i < pa.count; i++) {
    const x = pa.getX(i), z = pa.getZ(i), d = Math.hypot(x - 40, z - 110);
    const far = clamp((d - 260) / 400);
    const h = (vnoise(x / 40, z / 40) - 0.5) * 2.4 * (1 - far) + far * (vnoise(x / 160, z / 160) * 230 + vnoise(x / 50, z / 50) * 40) - 0.6;
    pa.setY(i, h);
    tmp.copy(g1).lerp(g2, clamp(vnoise(x / 25 + 9, z / 25) * 1.2 - 0.1));
    if (far > 0.5) tmp.lerp(new THREE.Color(pal.rock), clamp((h - 90) / 80)).lerp(new THREE.Color(0xffffff), clamp((h - 170) / 40));
    col.push(tmp.r, tmp.g, tmp.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); tg.computeVertexNormals();
  scene.add(new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true })));

  // lake
  const lake = new THREE.Mesh(new THREE.CircleGeometry(55, 48), new THREE.MeshLambertMaterial({ color: pal.water }));
  lake.rotation.x = -Math.PI / 2; lake.position.set(-70, 0.15, 160); scene.add(lake);

  // trees
  const treeN = 2600, trunk = new THREE.CylinderGeometry(0.25, 0.35, 2, 6); trunk.translate(0, 1, 0);
  const crown = new THREE.ConeGeometry(1.6, 5, 7); crown.translate(0, 4.5, 0);
  const TI = new THREE.InstancedMesh(trunk, new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), treeN);
  const CI = new THREE.InstancedMesh(crown, new THREE.MeshLambertMaterial({ color: 0xffffff }), treeN);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  let k = 0;
  while (k < treeN) {
    const x = (rng() - 0.5) * 700 + 40, z = (rng() - 0.5) * 700 + 110;
    if (nearTrack(x, z, 7) || Math.hypot(x + 70, z - 160) < 60) continue;
    const s = 0.7 + rng() * 1.1;
    m.compose(new THREE.Vector3(x, -0.3, z), q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * 6), new THREE.Vector3(s, s * (0.8 + rng() * 0.6), s));
    TI.setMatrixAt(k, m); CI.setMatrixAt(k, m);
    CI.setColorAt(k, c.set(pal.trees[Math.floor(rng() * pal.trees.length)]).offsetHSL(0, 0, (rng() - 0.5) * 0.08));
    k++;
  }
  scene.add(TI, CI);

  // clouds
  const cg = new THREE.IcosahedronGeometry(1, 2), cm = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x666677 });
  for (let i = 0; i < 40; i++) {
    const grp = new THREE.Group(), cx = (rng() - 0.5) * 1400, cz = (rng() - 0.5) * 1400 + 100, cy = 120 + rng() * 120;
    for (let j = 0; j < 6; j++) { const b = new THREE.Mesh(cg, cm); const r = 14 + rng() * 18; b.scale.set(r * 1.4, r * 0.6, r); b.position.set(cx + (rng() - 0.5) * 60, cy + rng() * 8, cz + (rng() - 0.5) * 30); grp.add(b); }
    scene.add(grp);
  }
  // silly floating balloons (each video gets its own colours/positions via the seed)
  const bg = new THREE.SphereGeometry(1.6, 16, 12);
  for (let i = 0; i < 70; i++) {
    const idx = Math.floor(rng() * track.N), p = track.pos[idx];
    const b = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ color: pal.balloons[i % pal.balloons.length], roughness: 0.3 }));
    b.scale.y = 1.25;
    const sd = track.side[idx], off = (10 + rng() * 30) * (rng() < 0.5 ? -1 : 1);
    b.position.set(p.x + sd.x * off, Math.max(6, p.y + 3 + rng() * 18), p.z + sd.z * off);
    scene.add(b);
  }
  scene.add(trackMesh(track, pal));
}

function buildCart(pal) { // front of the car, attached to the camera
  const g = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: pal.cart, metalness: 0.3, roughness: 0.35 });
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.35, 1.0), body); nose.position.set(0, -1.32, -1.35); nose.rotation.x = 0.12; g.add(nose);
  const lip = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.5, 12), body); lip.rotation.z = Math.PI / 2; lip.position.set(0, -1.16, -1.85); g.add(lip);
  const bar = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.045, 8, 24, Math.PI), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 }));
  bar.position.set(0, -1.25, -0.95); g.add(bar);
  return g;
}

// ---------- captions (style from story-video renderer) ----------
const FONT = "'Inter','Helvetica Neue',Arial,sans-serif";
function backOut(x) { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lyricLines() { // group words into caption chunks by line break (max 4 words)
  const out = []; let cur = [];
  for (const w of TL.words) {
    cur.push(w);
    if (cur.length >= 6 || w.eol) { out.push(cur); cur = []; }
  }
  if (cur.length) out.push(cur);
  return out;
}
function drawCaptions(t) {
  const cs = TL._chunks; let c = null;
  for (let i = 0; i < cs.length; i++) {
    const s = cs[i][0].t0, last = cs[i][cs[i].length - 1], e = Math.min(i + 1 < cs.length ? cs[i + 1][0].t0 : 1e9, last.t1 + 0.9);
    if (t >= s - 0.05 && t < e) { c = cs[i]; c.s = s; break; }
  }
  if (!c) return;
  octx.font = `900 92px ${FONT}`;
  const sp = 24, words = c.map(w => w.w.toUpperCase()), widths = words.map(w => octx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (c.length - 1), scale = Math.min(1, 980 / total);
  const pop = backOut((t - c.s) / 0.18);
  octx.save(); octx.translate(W / 2, 1380); octx.scale(scale * (0.85 + 0.15 * pop), scale * (0.85 + 0.15 * pop));
  octx.rotate(Math.sin(t * 2.1) * 0.015);
  let x = -total / 2; octx.textBaseline = 'middle'; octx.lineJoin = 'round';
  c.forEach((w, i) => {
    const active = t >= w.t0 - 0.03, now = active && t < (c[i + 1] ? c[i + 1].t0 : w.t1 + 0.3);
    const hop = now ? -10 * Math.max(0, 1 - (t - w.t0) / 0.15) : 0;
    octx.lineWidth = 18; octx.strokeStyle = 'rgba(0,0,0,0.92)'; octx.strokeText(words[i], x, hop);
    octx.fillStyle = now ? TL.accent : active ? '#ffffff' : 'rgba(255,255,255,0.55)';
    octx.fillText(words[i], x, hop); x += widths[i] + sp;
  });
  octx.restore();
}
function drawTitle(t) {
  if (!TL.title) return;
  const a = clamp(1 - (t - 3.2) / 0.5);
  if (a <= 0) return;
  octx.save(); octx.globalAlpha = a; octx.font = `900 64px ${FONT}`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.lineJoin = 'round'; octx.lineWidth = 16; octx.strokeStyle = 'rgba(0,0,0,0.9)';
  TL.title.forEach((ln, i) => { octx.strokeText(ln, W / 2, 330 + i * 84); octx.fillStyle = i ? TL.accent : '#fff'; octx.fillText(ln, W / 2, 330 + i * 84); });
  octx.restore();
}

// ---------- frame ----------
const tmpV = new THREE.Vector3();
function beatPulse(t, arr, k) { // decaying pulse after the most recent beat
  let lo = 0, hi = arr.length - 1, b = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { b = m; lo = m + 1; } else hi = m - 1; }
  return b < 0 ? 0 : Math.exp(-(t - arr[b]) * k);
}
function drawFrame(t) {
  const s = sAt(t), p = sample(track.pos, s), up = sample(track.up, s).normalize();
  const look = sample(track.pos, s + 7 / track.ds), lup = sample(track.up, s + 7 / track.ds).normalize();
  const si = Math.floor(s) % track.N, speed = (si >= START && si <= track.crest) ? 4 : track.v[si];
  const kick = beatPulse(t, TL.beats, 10), down = beatPulse(t, TL.downbeats, 5);
  const shake = Math.min(1, speed / 28) * 0.035;
  camera.position.copy(p).addScaledVector(up, 1.45 - kick * 0.07)
    .add(tmpV.set(Math.sin(t * 37) * shake, Math.sin(t * 29 + 1) * shake, 0));
  camera.up.copy(up.clone().lerp(lup, 0.3).normalize());
  camera.lookAt(look.addScaledVector(lup, 1.1));
  camera.fov = 92 + down * 4 + Math.min(10, speed * 0.25);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  octx.drawImage(renderer.domElement, 0, 0);
  // speed vignette
  const v = octx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${0.25 + Math.min(0.25, speed / 100)})`);
  octx.fillStyle = v; octx.fillRect(0, 0, W, H);
  drawTitle(t); drawCaptions(t);
}

function setup(tl) {
  TL = tl; rng = mulberry(tl.seed || 7);
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  camera = new THREE.PerspectiveCamera(92, W / H, 0.1, 4000);
  out = document.createElement('canvas'); out.width = W; out.height = H; octx = out.getContext('2d');
  document.body.appendChild(out);
  track = buildTrack();
  const keyIdx = { crest: track.crest, loopTop: nearestIdx(new THREE.Vector3(4.5, 35.2, 172)) };
  timeMap = buildTimeMap(track, (tl.keys || []).map(k => ({ at: k.at, i: keyIdx[k.at], t: k.t })), tl.duration, tl.liftSpeed || 4);
  buildWorld(tl.palette); camera.add(buildCart(tl.palette)); scene.add(camera);
  TL._chunks = tl.words ? lyricLines() : [];
  TL.beats = TL.beats || []; TL.downbeats = TL.downbeats || [];
  return { START, L: track.L, N: track.N, crest: track.crest, loopTop: keyIdx.loopTop, hmax: track.hmax };
}
function nearestIdx(v) { let b = 0, d = 1e9; track.pos.forEach((p, i) => { const e = p.distanceTo(v); if (e < d) { d = e; b = i; } }); return b; }
function frames(t0, n, fps, q = 0.9) { const o = []; for (let i = 0; i < n; i++) { drawFrame(t0 + i / fps); o.push(out.toDataURL('image/jpeg', q)); } return o; }
window.setup = setup; window.frames = frames; window.ready = true;
</script>
