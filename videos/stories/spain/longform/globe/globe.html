<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// Deterministic globe interludes for the long-form cut: Three.js globe + GSAP camera timeline,
// with a crisp 2D overlay (Spain highlight, markers, routes, chapter text, captions).
import * as THREE from './node_modules/three/build/three.module.js';

const W = 1920, H = 1080, ACC = '#E8B44A';
const SANS = "'Inter', 'Helvetica Neue', Arial, sans-serif", SERIF = "'DejaVu Serif', Georgia, serif";
const out = document.getElementById('out'), g = out.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const D2R = Math.PI / 180;
// same mapping as THREE.SphereGeometry's equirectangular UVs
function vec(lat, lon, r = 1) {
  const phi = (lon + 180) * D2R, th = (90 - lat) * D2R;
  return new THREE.Vector3(-r * Math.cos(phi) * Math.sin(th), r * Math.cos(th), r * Math.sin(phi) * Math.sin(th));
}

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.6); scene.add(sun);

let land, countries;
async function buildTexture() {
  const c = document.createElement('canvas'); c.width = 8192; c.height = 4096;
  const x = c.getContext('2d');
  const og = x.createLinearGradient(0, 0, 0, c.height);
  og.addColorStop(0, '#0d1b2c'); og.addColorStop(.5, '#16304a'); og.addColorStop(1, '#0d1b2c');
  x.fillStyle = og; x.fillRect(0, 0, c.width, c.height);
  const P = ([lon, lat]) => [(lon + 180) / 360 * c.width, (90 - lat) / 180 * c.height];
  const polys = f => f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const path = rings => { x.beginPath(); for (const r of rings) r.forEach((p, i) => { const [a, b] = P(p); i ? x.lineTo(a, b) : x.moveTo(a, b); }); };
  // parchment land
  for (const f of land.features) for (const poly of polys(f)) { path(poly); x.fillStyle = '#cdb68a'; x.fill('evenodd'); }
  const r = rng(3);   // paper mottling, land only
  x.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(90,60,25,${r() * .07})`; x.beginPath(); x.arc(r() * c.width, r() * c.height, 6 + r() * 60, 0, 6.283); x.fill(); }
  x.globalCompositeOperation = 'source-over';
  x.strokeStyle = 'rgba(80,55,30,0.35)'; x.lineWidth = 2;
  for (const f of countries.features) for (const poly of polys(f)) { path(poly); x.stroke(); }
  // graticule
  x.strokeStyle = 'rgba(232,180,74,0.10)'; x.lineWidth = 2;
  for (let lon = -180; lon <= 180; lon += 15) { x.beginPath(); x.moveTo(...P([lon, 90])); x.lineTo(...P([lon, -90])); x.stroke(); }
  for (let lat = -75; lat <= 75; lat += 15) { x.beginPath(); x.moveTo(...P([-180, lat])); x.lineTo(...P([180, lat])); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function coastlines() {
  const pts = [];
  for (const f of land.features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) for (let i = 1; i < ring.length; i++) {
      pts.push(vec(ring[i - 1][1], ring[i - 1][0], 1.0015), vec(ring[i][1], ring[i][0], 1.0015));
    }
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x5a3d1e, transparent: true, opacity: 0.8 }));
}
function atmosphere() {
  const m = new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: 'varying vec3 n; void main(){ n = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 n; void main(){ float i = pow(0.72 - dot(n, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.95,0.72,0.35,1.0)*i*1.4; }',
  });
  return new THREE.Mesh(new THREE.SphereGeometry(1.12, 96, 96), m);
}

// Spain (modern borders) for the highlight, as lat/lon rings
let SPAIN = [];
function spainRings() {
  const f = countries.features.find(f => f.properties.ADM0_A3 === 'ESP' || f.properties.ISO_A3 === 'ESP');
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  return polys.map(p => p[0].map(([lon, lat]) => vec(lat, lon, 1.002)));
}

// ---------- projection helpers ----------
const tmp = new THREE.Vector3();
function proj(v) {   // -> [x, y, visible]
  tmp.copy(v).project(camera);
  const facing = v.clone().normalize().dot(camera.position.clone().sub(v).normalize()) > 0.02;
  return [(tmp.x + 1) / 2 * W, (1 - tmp.y) / 2 * H, facing];
}
function greatCircle(a, b, n = 80) {
  const va = vec(a[0], a[1]), vb = vec(b[0], b[1]), out = [];
  const ang = va.angleTo(vb);
  for (let i = 0; i <= n; i++) {
    const k = i / n, s = Math.sin(ang);
    const p = va.clone().multiplyScalar(Math.sin((1 - k) * ang) / s).add(vb.clone().multiplyScalar(Math.sin(k * ang) / s));
    out.push(p.normalize().multiplyScalar(1.003 + Math.sin(k * Math.PI) * ang * 0.05));
  }
  return out;
}

// ---------- 2D overlay ----------
function background(t) {
  const bg = g.createRadialGradient(W * .5, H * .5, 100, W * .5, H * .5, W * .75);
  bg.addColorStop(0, '#15110c'); bg.addColorStop(1, '#050403');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const r = rng(11);
  for (let i = 0; i < 260; i++) {
    const x = r() * W, y = r() * H, s = r() * 1.8 + .4, ph = r() * 6.28;
    g.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(t * 1.3 + ph)); g.fillStyle = '#f4e6c8'; g.fillRect(x, y, s, s);
  }
  g.globalAlpha = 1;
}
function drawSpain(alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  g.beginPath();
  for (const ring of SPAIN) { let first = true; for (const v of ring) { const [x, y, ok] = proj(v); if (!ok) { first = true; continue; } first ? g.moveTo(x, y) : g.lineTo(x, y); first = false; } g.closePath(); }
  g.fillStyle = 'rgba(232,180,74,0.30)'; g.fill('evenodd');
  g.lineWidth = 3; g.strokeStyle = ACC; g.shadowColor = 'rgba(232,180,74,0.8)'; g.shadowBlur = 14; g.stroke();
  g.restore();
}
function drawRoute(pts, k) {
  if (k <= 0 || !pts) return;
  const n = Math.floor(pts.length * clamp(k));
  g.save(); g.lineWidth = 5; g.strokeStyle = '#fff4dc'; g.setLineDash([16, 12]); g.lineCap = 'round';
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 8;
  g.beginPath(); let pen = false, last = null;
  for (let i = 0; i < n; i++) { const [x, y, ok] = proj(pts[i]); if (!ok) { pen = false; continue; } pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; last = [x, y]; }
  g.stroke(); g.setLineDash([]);
  if (last && k < 1) { g.fillStyle = ACC; g.beginPath(); g.arc(last[0], last[1], 9, 0, 6.283); g.fill(); }
  g.restore();
}
function drawMarker(lat, lon, k, t, label) {
  if (k <= 0) return;
  const [x, y, ok] = proj(vec(lat, lon, 1.002)); if (!ok) return;
  g.save(); g.globalAlpha = clamp(k * 1.5);
  for (let i = 0; i < 2; i++) {   // pulse rings
    const ph = ((t * 0.8 + i * 0.5) % 1);
    g.strokeStyle = `rgba(232,180,74,${(1 - ph) * 0.9})`; g.lineWidth = 4;
    g.beginPath(); g.arc(x, y, 14 + ph * 70, 0, 6.283); g.stroke();
  }
  const s = easeOut(k);
  g.fillStyle = ACC; g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 12;
  g.beginPath(); g.arc(x, y, 13 * s, 0, 6.283); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(x, y, 5 * s, 0, 6.283); g.fill();
  if (label) {
    g.shadowBlur = 0; g.font = `700 34px ${SANS}`; const w = g.measureText(label).width + 40;
    const lx = x + 34, ly = y - 70;
    g.fillStyle = 'rgba(10,8,6,0.78)'; g.beginPath(); g.roundRect(lx, ly, w, 58, 12); g.fill();
    g.fillStyle = ACC; g.fillRect(lx, ly, 6, 58);
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(label, lx + 22, ly + 30);
    g.strokeStyle = 'rgba(232,180,74,0.8)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + 10, y - 10); g.lineTo(lx, ly + 58); g.stroke();
  }
  g.restore();
}
function chapterText(c, t) {
  const a = easeOut((t - 0.5) / 0.6), b = easeOut((t - 0.8) / 0.6), d = easeOut((t - 1.1) / 0.6);
  g.save(); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const x = 120, y = H - 250;
  g.globalAlpha = a; g.font = `800 34px ${SANS}`; g.letterSpacing = '8px'; g.fillStyle = ACC;
  g.fillText(`CHAPTER ${String(c.n).padStart(2, '0')}`, x + (1 - a) * -40, y);
  g.letterSpacing = '0px';
  g.globalAlpha = b; g.font = `700 92px ${SERIF}`; g.fillStyle = '#fff';
  g.shadowColor = 'rgba(0,0,0,0.85)'; g.shadowBlur = 24;
  g.fillText(c.title, x + (1 - b) * -60, y + 100);
  g.globalAlpha = d; g.font = `500 40px ${SANS}`; g.fillStyle = 'rgba(255,240,215,0.92)';
  g.fillText(c.years, x, y + 160);
  g.shadowBlur = 0; g.fillStyle = ACC; g.fillRect(x, y + 22, 140 * d, 4);
  g.restore();
}
function captions(meta, t) {
  for (const l of meta.lines) {
    if (t < l.start || t > l.end + 0.35) continue;
    // up to ~6 words per caption line
    const ws = l.words, chunks = []; let cur = [];
    for (const w of ws) { cur.push(w); if (cur.length >= 6 || /[.,?!;:]$/.test(w.w)) { chunks.push(cur); cur = []; } }
    if (cur.length) chunks.push(cur);
    let c = chunks[0];
    for (const ch of chunks) if (t >= ch[0].t0 - 0.02) c = ch;
    g.save(); g.font = `800 62px ${SANS}`; g.textBaseline = 'middle'; g.lineJoin = 'round';
    const txt = c.map(w => w.w.toUpperCase()); const sp = 20;
    const ws2 = txt.map(s => g.measureText(s).width); const total = ws2.reduce((a, b) => a + b, 0) + sp * (txt.length - 1);
    let x = W / 2 - total / 2;
    txt.forEach((s, i) => {
      const on = t >= c[i].t0;
      g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,0.9)'; g.strokeText(s, x, H - 140);
      g.fillStyle = on ? (c[i + 1] && t >= c[i + 1].t0 ? '#fff' : ACC) : 'rgba(255,255,255,0.55)'; g.fillText(s, x, H - 140);
      x += ws2[i] + sp;
    });
    g.restore();
  }
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function fade(t, dur, fin = 0.35, fout = 0.45) {
  const k = Math.min(clamp(t / fin), clamp((dur - t) / fout));
  if (k < 1) { g.fillStyle = `rgba(0,0,0,${1 - k})`; g.fillRect(0, 0, W, H); }
}

// ---------- clips ----------
let CLIP = null, TLN = null, CAM = { lat: 0, lon: 0, dist: 3 }, LOGO = null;
function placeCamera() {
  camera.position.copy(vec(CAM.lat, CAM.lon, CAM.dist));
  camera.up.set(0, 1, 0);
  // keep the target a touch below/left of centre so the marker sits right of the chapter text
  const tgt = vec(CAM.lat, CAM.lon, 1).multiplyScalar(0.0);
  camera.lookAt(tgt);
  const off = (CAM.dist - 1) * 0.18;
  camera.translateX(-off); camera.translateY(-off * 0.35);
  sun.position.copy(vec(CAM.lat + 25, CAM.lon - 35, 5));
}
function setClip(c) {
  CLIP = c; CAM = { ...c.from };
  if (TLN) TLN.kill();
  TLN = gsap.timeline({ paused: true });
  if (c.kind === 'chapter') {
    const ang = vec(c.from.lat, c.from.lon).angleTo(vec(c.to.lat, c.to.lon)) / D2R;
    const peak = Math.max(c.from.dist, c.to.dist) + Math.min(2.2, 0.25 + ang / 25);
    TLN.to(CAM, { lat: c.to.lat, lon: c.to.lon, duration: 2.6, ease: 'power2.inOut' }, 0)
       .to(CAM, { dist: peak, duration: 1.3, ease: 'power2.out' }, 0)
       .to(CAM, { dist: c.to.dist, duration: 1.3, ease: 'power2.in' }, 1.3)
       .to(CAM, { dist: c.to.dist * 0.96, duration: 1.4, ease: 'none' }, 2.6);
    CLIP.route = c.route ? c.route.slice(1).flatMap((p, i) => greatCircle(c.route[i], p, 60)) : null;
  } else {
    TLN.to(CAM, { lat: c.to.lat, lon: c.to.lon, dist: c.to.dist, duration: c.duration - 0.5, ease: c.kind === 'intro' ? 'power1.inOut' : 'sine.inOut' }, 0);
  }
  return true;
}
function drawAt(t) {
  TLN.seek(t, false); placeCamera();
  renderer.render(scene, camera);
  background(t);
  g.drawImage(renderer.domElement, 0, 0);
  const c = CLIP;
  if (c.kind === 'chapter') {
    drawSpain(c.spain ? 0.8 - 0.5 * clamp((t - 2.2) / 0.8) : 0);
    drawRoute(c.route, (t - 1.0) / 2.2);
    const [mlat, mlon] = c.markerAt || [c.to.lat, c.to.lon];
    drawMarker(mlat, mlon, (t - 2.0) / 0.4, t, (t > 2.2) ? c.place : null);
    vignette(); chapterText(c, t);
  } else if (c.kind === 'intro') {
    drawSpain(clamp((t - 6) / 3));
    vignette(); captions(c.meta, t);
    const k = easeOut((t - (c.duration - 4.4)) / 0.8);
    if (k > 0) {
      g.save(); g.fillStyle = `rgba(0,0,0,${0.55 * k})`; g.fillRect(0, 0, W, H);
      g.globalAlpha = k; g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 30;
      g.font = `800 34px ${SANS}`; g.letterSpacing = '10px'; g.fillStyle = ACC; g.fillText('HISTORY SKETCHES PRESENTS', W / 2, H / 2 - 120);
      g.letterSpacing = '0px'; g.font = `700 120px ${SERIF}`; g.fillStyle = '#fff'; g.fillText(c.title, W / 2, H / 2 + 20);
      g.font = `500 44px ${SANS}`; g.fillStyle = 'rgba(255,240,215,0.92)'; g.fillText('35,000 years · 23 chapters', W / 2, H / 2 + 100);
      g.restore();
    }
  } else if (c.kind === 'outro') {
    drawSpain(0.7);
    vignette(); captions(c.meta, t);
    const k = easeOut((t - (c.duration - 3.6)) / 0.8);
    if (k > 0 && LOGO) {
      g.save(); g.fillStyle = `rgba(0,0,0,${0.6 * k})`; g.fillRect(0, 0, W, H); g.globalAlpha = k;
      const s = 360; g.beginPath(); g.arc(W / 2, H / 2 - 60, s / 2, 0, 6.283); g.clip();
      g.drawImage(LOGO, W / 2 - s / 2, H / 2 - 60 - s / 2, s, s); g.restore();
      g.save(); g.globalAlpha = k; g.textAlign = 'center'; g.font = `800 52px ${SANS}`; g.letterSpacing = '8px'; g.fillStyle = '#fff';
      g.fillText('HISTORY SKETCHES', W / 2, H / 2 + 200); g.restore();
    }
  }
  // paper grain
  const r = rng(Math.floor(t * 30) + 7); g.fillStyle = 'rgba(255,240,210,0.04)';
  for (let i = 0; i < 1400; i++) g.fillRect(r() * W, r() * H, 2, 2);
  fade(t, c.duration);
}
function frames(t0, n, fps) {
  const res = [];
  for (let i = 0; i < n; i++) { drawAt(t0 + i / fps); res.push(out.toDataURL('image/jpeg', 0.92)); }
  return res;
}
async function init(logoSrc) {
  await Promise.all([`800 40px Inter`, `700 40px Inter`, `500 40px Inter`].map(f => document.fonts.load(f).catch(() => 0)));
  [land, countries] = await Promise.all(['../geo/ne_50m_land.geojson', '../geo/ne_50m_admin_0_countries.geojson'].map(u => fetch(u).then(r => r.json())));
  const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 192), new THREE.MeshLambertMaterial({ map: await buildTexture() }));
  scene.add(globe, coastlines(), atmosphere());
  SPAIN = spainRings();
  if (logoSrc) LOGO = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = logoSrc; });
  return true;
}
Object.assign(window, { init, setClip, frames, drawAt });
window.ready = true;
</script>
</body>
</html>
