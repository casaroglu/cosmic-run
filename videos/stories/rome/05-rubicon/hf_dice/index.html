<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'SketchHand';src:url('assets/BradleyHandBold.ttf') format('truetype');font-weight:700}
:root{--paper:#efe4c9;--ink:#2a2119;--red:#b3261e;--hand:'SketchHand',cursive}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1080px;height:1920px;font-family:var(--hand);color:var(--ink);
 background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(70,45,15,.45) 100%),var(--paper)}
.die{position:absolute;width:190px;height:190px;background:#fbf6ea;border:7px solid var(--ink);border-radius:30px;box-shadow:0 14px 24px rgba(60,40,10,.35)}
.pip{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--ink)}
#d1{left:290px;top:520px} #d2{left:560px;top:540px}
#lat{position:absolute;left:190px;width:660px;top:840px;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:68px;letter-spacing:2px;color:var(--red)}
#en{position:absolute;left:170px;width:700px;top:960px;text-align:center;font-size:62px;font-weight:700}
#src{position:absolute;left:170px;width:700px;top:1050px;text-align:center;font-size:40px;font-weight:700;color:#5a4a36}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
 <div id="scene" class="clip" data-start="0" data-duration="9" data-track-index="0" style="position:absolute;inset:0">
  <div class="die" id="d1"><div class="pip" style="left:30px;top:30px"></div><div class="pip" style="left:78px;top:78px"></div><div class="pip" style="left:126px;top:126px"></div></div>
  <div class="die" id="d2"><div class="pip" style="left:30px;top:30px"></div><div class="pip" style="left:126px;top:30px"></div><div class="pip" style="left:78px;top:78px"></div><div class="pip" style="left:30px;top:126px"></div><div class="pip" style="left:126px;top:126px"></div></div>
  <div id="lat">ALEA IACTA EST</div>
  <div id="en">"The die is cast"</div>
  <div id="src">Suetonius, Life of Caesar 32</div>
 </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#d1", { x: -420, y: -380, rotation: -540 }, { x: 0, y: 0, rotation: -12, duration: 1.3, ease: "bounce.out" }, 0.2);
tl.fromTo("#d2", { x: 420, y: -460, rotation: 600 }, { x: 0, y: 0, rotation: 9, duration: 1.4, ease: "bounce.out" }, 0.35);
tl.fromTo("#lat", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.6);
tl.from("#en", { opacity: 0, y: 20, duration: 0.5 }, 4.2);
tl.from("#src", { opacity: 0, duration: 0.5 }, 5.0);
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
