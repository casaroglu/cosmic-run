<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'SketchHand';src:url('assets/BradleyHandBold.ttf') format('truetype');font-weight:700}
:root{--paper:#efe4c9;--ink:#2a2119;--red:#b3261e;--gold:#b8862b;--hand:'SketchHand',cursive}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1080px;height:1920px;font-family:var(--hand);color:var(--ink);
 background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(70,45,15,.45) 100%),var(--paper)}
#years{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:64px;font-weight:700}
#count{position:absolute;left:0;right:0;top:390px;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:170px;color:var(--red);line-height:1}
#lab{position:absolute;left:0;right:0;top:570px;text-align:center;font-size:58px;font-weight:700}
#grid{position:absolute;left:150px;top:680px;width:780px;display:flex;flex-wrap:wrap;gap:18px 22px;justify-content:center}
.w{width:104px;height:104px;border-radius:50%;border:9px dotted var(--gold);position:relative;background:rgba(251,246,234,.6)}
.w::after{content:'';position:absolute;left:50%;top:-14px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--red)}
#avg{position:absolute;left:120px;width:840px;top:1240px;text-align:center;font-size:54px;font-weight:700}
#stamp{position:absolute;left:300px;top:1340px;width:480px;text-align:center;border:9px solid var(--red);color:var(--red);font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:78px;border-radius:10px;transform:rotate(-7deg);padding:6px 0}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
 <div id="scene" class="clip" data-start="0" data-duration="16" data-track-index="0" style="position:absolute;inset:0">
  <div id="years">AD <span id="yr">235</span></div>
  <div id="count">0</div>
  <div id="lab">emperors</div>
  <div id="grid"></div>
  <div id="avg">about 2 years each, on average</div>
  <div id="stamp">MOST KILLED</div>
 </div>
</div>
<script>
const g = document.getElementById('grid');
for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'w'; g.appendChild(d); }
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const st = { n: 0, y: 235 };
tl.from('#years', { opacity: 0, y: -30, duration: 0.5 }, 0.1);
tl.from(['#count', '#lab'], { opacity: 0, duration: 0.4 }, 0.3);
tl.to(st, { n: 26, y: 284, duration: 4.2, ease: 'none', onUpdate: () => {
  document.getElementById('count').textContent = Math.round(st.n);
  document.getElementById('yr').textContent = Math.round(st.y); } }, 0.6);
tl.from('.w', { opacity: 0, scale: 0.3, duration: 0.25, stagger: 4.2 / 26, ease: 'back.out(2)' }, 0.6);
tl.from('#avg', { opacity: 0, y: 20, duration: 0.5 }, 5.4);
tl.fromTo('#stamp', { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' }, 7.2);
window.__timelines['main'] = tl;
tl.seek(0);
</script></body></html>
