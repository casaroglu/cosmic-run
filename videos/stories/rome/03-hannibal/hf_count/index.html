<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'SketchHand';src:url('assets/BradleyHandBold.ttf') format('truetype');font-weight:700}
:root{--paper:#efe4c9;--ink:#2a2119;--red:#b3261e;--gold:#8a6420;--hand:'SketchHand',cursive}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1080px;height:1920px;font-family:var(--hand);color:var(--ink);
 background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(70,45,15,.45) 100%),var(--paper)}
#head{position:absolute;left:110px;width:780px;top:380px;text-align:center;font-size:66px;font-weight:700}
.row{position:absolute;left:110px;width:780px}
.lab{font-size:50px;font-weight:700}
.num{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:92px;margin-top:6px}
.barwrap{margin-top:14px;height:56px;width:780px;border:5px solid var(--ink);border-radius:10px;overflow:hidden}
.bar{height:100%;width:100%;background:#7a5a2a;transform-origin:left center}
#r1{top:540px} #r2{top:860px}
#r2 .num{color:var(--red)} #r2 .bar{background:var(--red)}
#note{position:absolute;left:110px;width:780px;top:1200px;text-align:center;font-size:56px;font-weight:700;color:var(--red)}
#note2{position:absolute;left:110px;width:780px;top:1290px;text-align:center;font-size:46px;font-weight:700}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
 <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="0" style="position:absolute;inset:0">
  <div id="head">Hannibal's army</div>
  <div class="row" id="r1"><div class="lab">after the Pyrenees</div><div class="num" id="n1">0</div><div class="barwrap"><div class="bar" id="b1"></div></div></div>
  <div class="row" id="r2"><div class="lab">arriving in Italy</div><div class="num" id="n2">0</div><div class="barwrap"><div class="bar" id="b2"></div></div></div>
  <div id="note">more than half lost</div>
  <div id="note2">in about five months (Polybius)</div>
 </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const fmt = v => Math.round(v).toLocaleString('en-US');
const c1 = { v: 0 }, c2 = { v: 59000 };
tl.from("#head", { opacity: 0, y: 20, duration: 0.5 }, 0.1);
tl.from("#r1", { opacity: 0, duration: 0.4 }, 0.5);
tl.from("#b1", { scaleX: 0, duration: 1.4, ease: "power2.out" }, 0.7);
tl.to(c1, { v: 59000, duration: 1.4, ease: "power2.out", onUpdate: () => document.getElementById('n1').textContent = fmt(c1.v) }, 0.7);
tl.from("#r2", { opacity: 0, duration: 0.4 }, 3.0);
tl.fromTo("#b2", { scaleX: 1 }, { scaleX: 26 / 59, duration: 2.0, ease: "power2.inOut" }, 3.3);
tl.fromTo(c2, { v: 59000 }, { v: 26000, duration: 2.0, ease: "power2.inOut", onUpdate: () => document.getElementById('n2').textContent = fmt(c2.v) }, 3.3);
tl.from("#note", { opacity: 0, scale: 1.3, duration: 0.4, ease: "power3.out" }, 5.6);
tl.from("#note2", { opacity: 0, duration: 0.6 }, 6.3);
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
